name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest pyyaml requests cryptography bcrypt

      - name: Lint with flake8
        run: |
          # Lint the newly introduced code and attack runner with strict enforcement
          flake8 attack_runner.py tests/test_attack_runner.py tests/test_proxy.py --max-line-length=100
          # Run linting on the rest of the legacy repo with warnings reported (non-blocking)
          flake8 . \
            --max-line-length=100 \
            --exclude=.git,__pycache__,notebooks,website,data,models \
            --extend-ignore=E501,E221,E302,E305,W291,W293,F401,F841,F541,E741,F821 \
            --exit-zero

      - name: Check formatting with black
        run: |
          black --check --line-length 100 \
            attack_runner.py tests/test_attack_runner.py tests/test_proxy.py

      - name: Run unit tests with pytest
        run: |
          pytest tests/test_attack_runner.py tests/test_proxy.py -v --tb=short
