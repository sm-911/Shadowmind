name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest pyyaml requests
          # Install project deps (excluding heavy ML libs for CI speed)
          pip install customtkinter bcrypt cryptography pyyaml pandas numpy scikit-learn || true

      - name: Lint with flake8
        run: |
          flake8 . \
            --max-line-length=100 \
            --exclude=.git,__pycache__,notebooks,website \
            --extend-ignore=E501

      - name: Check formatting with black
        run: |
          black --check --line-length 100 \
            attack_runner.py proxy.py \
            src/ tests/

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short
